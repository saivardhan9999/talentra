# Rebuild the schema and verify every milestone on each push and pull request.
# The seed runs at 1% of laptop scale (about a minute); the full 1M-profile seed is a manual laptop run.
# Result is posted to Discord when the DISCORD_WEBHOOK_URL repository secret is set.
name: verify

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 16
        shell: bash
        run: |
          docker run -d --name talentra-pg --shm-size=1g -e POSTGRES_PASSWORD=talentra -v "$PWD/sql:/sql" postgres:16
          # Wait over TCP, not the socket: on first start the image runs a temporary socket-only server for initdb,
          # then shuts it down and starts the real one. A socket check can catch the temporary server just before
          # it stops ("the database system is shutting down"); only the real server listens on TCP.
          ready=0
          for i in $(seq 1 60); do docker exec talentra-pg pg_isready -h localhost -U postgres -q && ready=1 && break; sleep 1; done
          if [ "$ready" != 1 ]; then docker logs talentra-pg; echo "PostgreSQL did not become ready in 60 s"; exit 1; fi
          docker exec talentra-pg psql -U postgres -At -c "SELECT version()"

      - name: Build schema, seed at 1%, verify M1-M20
        id: verify
        shell: bash
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          # called through bash: the script is committed from Windows without the executable bit
          SEED_SCALE=0.01 bash ./run_phase1.sh 2>&1 | tee verify.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          retention-days: 14

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.verify.outputs.started }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 ci/notify_discord.py verify.log
